name: Verificar Firma
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: navegador
          path: artifacts/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: docker pull node:22-bookworm-slim
      - run: npm run test:docker
      - run: docker build --tag firma-qa .
      - run: docker run --rm firma-qa node scripts/image-smoke.cjs
